<div id="tx-main-flowchart">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #tx-main-flowchart {
      color-scheme: light dark;
      --bg: light-dark(#f8fafc, #111827);
      --fg: light-dark(#172033, #f1f5f9);
      --surface: light-dark(#ffffff, #1e293b);
      --decision: light-dark(#fff7d6, #3d3a2f);
      --io: light-dark(#e8f3ff, #26374d);
      --terminal: light-dark(#e8faef, #1d3a2c);
      --subprocess: light-dark(#f2ebff, #302b49);
      --muted: light-dark(#64748b, #aab4c5);
      width: 100%; height: 100vh; box-sizing: border-box;
      padding: 5px 10px 9px; display: flex; flex-direction: column;
      overflow: hidden; color: var(--fg); background: var(--bg);
      font-family: Arial, sans-serif;
    }
    #tx-main-flowchart h2 { margin: 0 0 1px; text-align: center; font-size: 20px; font-weight: 500; }
    #tx-main-flowchart .subtitle { margin: 0 0 3px; text-align: center; color: var(--muted); font-size: 12px; }
    #tx-main-flowchart svg { display: block; width: 100%; height: 100%; min-height: 0; flex: 1 1 auto; }
    #tx-main-flowchart .shape { fill: var(--surface); stroke: var(--fg); stroke-width: 1.6; }
    #tx-main-flowchart .decision { fill: var(--decision); }
    #tx-main-flowchart .io { fill: var(--io); }
    #tx-main-flowchart .terminal { fill: var(--terminal); }
    #tx-main-flowchart .subprocess { fill: var(--subprocess); }
    #tx-main-flowchart .flow { fill: none; stroke: var(--fg); stroke-width: 1.55; marker-end: url(#arrow); }
    #tx-main-flowchart .return { fill: none; stroke: var(--muted); stroke-width: 1.35; marker-end: url(#arrow-muted); }
    #tx-main-flowchart .divider { stroke: var(--fg); stroke-width: 1.1; }
    #tx-main-flowchart text { fill: var(--fg); font-size: 13px; font-weight: 400; text-anchor: middle; }
    #tx-main-flowchart .edge-label { fill: var(--muted); font-size: 12px; font-weight: 500; }
    #tx-main-flowchart .section { fill: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .8px; }
  </style>
